services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fincore_db}
      POSTGRES_USER: ${POSTGRES_USER:-fincore_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_with_local_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - fincore_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fincore_app} -d ${POSTGRES_DB:-fincore_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - fincore_private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics:
    build:
      context: ./apps/analytics
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
    networks:
      - fincore_private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fincore_app}:${POSTGRES_PASSWORD:-replace_with_local_dev_password}@postgres:5432/${POSTGRES_DB:-fincore_db}
      REDIS_URL: redis://redis:6379
      ANALYTICS_SERVICE_URL: http://analytics:8000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_in_prod_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_prod_32chars}
      REAUTH_SECRET: ${REAUTH_SECRET:-dev_reauth_secret_change_in_prod_32chars}
      SANDBOX_PAYMENT_WEBHOOK_SECRET: ${SANDBOX_PAYMENT_WEBHOOK_SECRET:-whsec_sandbox_test_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    volumes:
      - ./database:/app/database:ro
    networks:
      - fincore_private
      - fincore_public

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    ports:
      - "3000:3000"
    networks:
      - fincore_public

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - fincore_public

networks:
  fincore_private:
    internal: true
  fincore_public:
    driver: bridge

volumes:
  pgdata:
  redisdata:
